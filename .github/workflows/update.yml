name: Daily AI progress update

on:
  schedule:
    # UTC 12:00 = 多伦多 8:00 / 北京 20:00
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test public source handling
        run: python -m unittest discover -s tests

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch public sources (no API key)
        env:
          CONTENT_MODE: public
        run: python scripts/fetch_content.py

      - name: Commit and push changes
        run: |
          DATE=$(TZ="America/Toronto" date +"%Y-%m-%d")
          git add index.html feed.xml data/ archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily auto-update ${DATE}"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
